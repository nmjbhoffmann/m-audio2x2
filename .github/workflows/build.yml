name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mtrack-fix.exe
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: mtrack-fix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tool
      - name: Linux build dependencies (egui/winit: X11, Wayland, OpenGL headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxrandr-dev libxi-dev libgl1-mesa-dev libudev-dev
      - name: Check formatting
        working-directory: tool
        run: cargo fmt --check
      - name: Clippy
        working-directory: tool
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings
      - name: Test
        working-directory: tool
        run: cargo test --target ${{ matrix.target }}
      - name: Build (release)
        working-directory: tool
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "tool/target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp tool/firmware/mtrack2x2-upgrade-v1-signed.bin dist/
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mtrack-fix-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release files
        run: |
          mkdir -p out
          cp artifacts/mtrack-fix-windows-x64/mtrack-fix.exe out/mtrack-fix-windows-x64.exe
          cp artifacts/mtrack-fix-linux-x64/mtrack-fix out/mtrack-fix-linux-x64
          cp artifacts/mtrack-fix-windows-x64/mtrack2x2-upgrade-v1-signed.bin out/
          cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
