[package]
name = "mtrack-fix"
version = "1.0.0"
edition = "2021"
description = "Firmware fix tool for the M-Audio M-Track 2X2 (USB capture descriptor bug)"
license = "MIT"
build = "build.rs"

[dependencies]
nusb = "0.2.9"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
crc32fast = "1.5"
sha2 = "0.11"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_IO", "Win32_System_Registry", "Win32_Storage_FileSystem",
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_Usb",
  "Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell",
] }

[build-dependencies]
embed-manifest = "1.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
